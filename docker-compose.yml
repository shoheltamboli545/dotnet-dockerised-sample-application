services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:  
      - OTEL_SERVICE_NAME=dotnet-backend  
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318 
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf  
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=test  
    extra_hosts:
      - "host.docker.internal:host-gateway"  
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
